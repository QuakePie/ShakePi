name: ShakePie CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libgpiod-dev clang-tidy
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSHAKEPIE_BUILD_PI=ON -DSHAKEPIE_BUILD_TESTS=ON -DSHAKEPIE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Clang tidy
        run: cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSHAKEPIE_BUILD_PI=ON -DSHAKEPIE_BUILD_TESTS=OFF -DSHAKEPIE_ENABLE_CLANG_TIDY=ON && cmake --build build-tidy --parallel

  windows-cpp:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable core
        run: cmake -S . -B build -A x64 -DSHAKEPIE_BUILD_PI=ON -DSHAKEPIE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    name: Python (${{ matrix.package }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, package: laptop, extras: dev}
          - {os: windows-2025, package: laptop, extras: dev}
          - {os: ubuntu-24.04, package: archive-web, extras: 'dev,dayplot'}
          - {os: windows-2025, package: archive-web, extras: 'dev,dayplot'}
          - {os: ubuntu-24.04, package: terminal, extras: dev}
          - {os: windows-2025, package: terminal, extras: dev}
          - {os: ubuntu-24.04, package: oled, extras: dev}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Check protocol fixture generator
        if: matrix.package == 'laptop'
        run: python -m ruff check ../protocol/generate_fixture.py
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest -q
