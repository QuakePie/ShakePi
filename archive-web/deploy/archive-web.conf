[web]
bind_address = 0.0.0.0
port = 8050
workers = 1
threads = 2
status_refresh_seconds = 15

[archive]
mount_point = /mnt/shakepie-data
data_directory = /mnt/shakepie-data/recordings
catalog_path = /mnt/shakepie-data/index/archive.sqlite
reconcile_minutes = 15
require_mount = true

[dayplot]
output_directory = /mnt/shakepie-data/dayplots
temporary_directory = /mnt/shakepie-data/dayplots/tmp
output_format = png
interval_minutes = 60
width_pixels = 1600
# View rate for dayplots; the settings page keeps this aligned with the recorder.
target_sample_rate_hz = 200
# Completed UTC days automatically receive a daily plot; the worker rechecks every hour.
auto_generate_days = true
auto_check_seconds = 600
maximum_concurrent_jobs = 1
minimum_free_gib = 5
memory_limit_mib = 1024
worker_nice = 15
io_scheduling_class = idle
idle_sleep_seconds = 10

[live]
enabled = true
host = 127.0.0.1
port = 8765
history_seconds = 30
refresh_milliseconds = 1000
idle_disconnect_seconds = 30
frequency_max_hz = 100
sample_rate_hz = 200

[recorded_plot]
waveform_bins = 1200
spectrogram_columns = 480
fft_size = 256
frequency_max_hz = 100

# STA/LTA event detection on the recorder's live stream (vertical channel).
# The trigger fires when the short-term average exceeds the long-term average by
# `threshold`; recommended starting points: 4.5 for noisy sites, 3.0-4.0 for quiet ones.
[detector]
enabled = true
sta_seconds = 1.0
lta_seconds = 30.0
threshold = 4.0
off_seconds = 5.0
cooldown_seconds = 30.0
maximum_events = 1000

# Bark push notifications (iOS app) for detected events. The device key is a secret and
# lives in /etc/shakepie/archive-web.env as SHAKEPIE_NOTIFY_BARK_KEY; without the key
# notifications stay disabled. rate_limit_seconds throttles trigger storms.
[notify]
enabled = true
bark_server = https://api.day.app
rate_limit_seconds = 600

# Earthquake watch points: poll USGS and/or ISC around user-defined coordinates.
# Points, radius, sources, check interval, and the found earthquakes are managed on the
# Watch page and stored in watch.state_path. New quakes push a Bark notification when
# notifications are configured.
[watch]
enabled = true
state_path = /var/lib/shakepie/watch.json
timeout_seconds = 20
usgs_base = https://earthquake.usgs.gov
isc_base = https://isc.ac.uk

[security]
session_cookie_secure = false
session_lifetime_minutes = 60
login_attempts = 5
login_window_seconds = 300

# Administrative recorder settings page. It writes recorder.conf and archive-web.conf
# (both group-writable for shakepie-web) and restarts services through a fixed polkit rule.
[recorder_admin]
enabled = true
recorder_conf_path = /etc/shakepie/recorder.conf
archive_conf_path = /etc/shakepie/archive-web.conf
calibrate_request_path = /var/lib/shakepie/calibrate.request

[health]
status_file = /run/shakepie/health.json
