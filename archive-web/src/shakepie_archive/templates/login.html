{% extends "base.html" %}
{% block title %}Sign in · ShakePie Archive{% endblock %}
{% block body_attributes %} class="login-body"{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="login-title">
  <div class="brand login-brand">
    <img class="login-logo" src="{{ url_for('static', filename='shakepie-logo.png') }}" alt="ShakePie ground motion recorder">
  </div>
  <h1 id="login-title">Sign in</h1>
  <p class="muted">Use the archive administrator password.</p>
  <form action="{{ url_for('login_submit') }}" method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" autofocus>
    <button class="button button-primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
