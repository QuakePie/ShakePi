[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shakepie-client"
version = "0.1.0"
description = "Native live monitor for the ShakePie three-component seismograph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Repository = "https://github.com/QuakePie/ShakePi"
Issues = "https://github.com/QuakePie/ShakePi/issues"

[project.scripts]
shakepie-client = "shakepie_client.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shakepie_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shakepie_client"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pyqtgraph.*"]
ignore_missing_imports = true
