[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shakepie-oled"
version = "1.0.0"
description = "OLED status display for the ShakePie recorder (SSD1306 over I2C)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "luma.oled>=3.12",
  "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/QuakePie/ShakePi"
Issues = "https://github.com/QuakePie/ShakePi/issues"

[project.scripts]
shakepie-oled = "shakepie_oled.display:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shakepie_oled"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shakepie_oled"]

[[tool.mypy.overrides]]
module = ["luma.*", "PIL.*"]
ignore_missing_imports = true
