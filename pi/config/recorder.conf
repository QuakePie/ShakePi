# ShakePie recorder configuration. Paths are examples and must match the Pi.
adc.backend=hardware
adc.spi_device=/dev/spidev0.0
adc.spi_speed_hz=1920000
adc.gpio_chip=/dev/gpiochip0
adc.cs_line=22
adc.drdy_line=17
adc.reset_line=18
adc.pga_gain=64
adc.data_rate_sps=7500
adc.reference_voltage_uv=2500000
adc.drdy_timeout_ms=1000
adc.input_buffer=false

acquisition.samples_per_block=64
acquisition.nominal_group_rate_hz=750
acquisition.max_consecutive_adc_errors=3

storage.hdd_mount=/mnt/shakepie-data
storage.data_directory=/mnt/shakepie-data/recordings
storage.rotation_minutes=15
storage.sync_interval_seconds=5
storage.queue_seconds=300
storage.aggregate_kib=128
storage.preallocate_mib=0
storage.station_id=SHAKEPIE

stream.bind_address=127.0.0.1
stream.port=8765
stream.live_queue_blocks=128
stream.client_queue_blocks=32
stream.max_clients=4
stream.keepalive_seconds=30
stream.write_timeout_seconds=15

health.status_file=/run/shakepie/health.json

# Zero calibration: when a calibration is requested (web interface or SSH console), the
# recorder measures each channel's mean over calibration.window_seconds and subtracts it
# from raw counts so data is recorded around 0. One automatic calibration also runs at
# every recorder start (calibration.auto_on_start): after startup_delay_seconds of
# settling it measures over startup_window_seconds (3-5 minutes is a good choice) and
# keeps those offsets for the whole run. Offsets persist in calibration.state_file so
# data stays centered from the first sample while the startup measurement runs. Measured
# means beyond calibration.max_offset_counts are rejected (protects against calibrating
# during a disturbance). Recording never stops during calibration.
calibration.enabled=true
calibration.window_seconds=10
calibration.auto_on_start=true
calibration.startup_delay_seconds=30
calibration.startup_window_seconds=300
calibration.max_offset_counts=4000000
calibration.request_file=/var/lib/shakepie/calibrate.request
calibration.state_file=/var/lib/shakepie/zero_offsets.conf
calibration.restore_on_start=true

# Fake-backend controls (used only when adc.backend=fake).
fake.seed=12648430
fake.noise_amplitude=250
fake.impulse_every=0
fake.clip_every=0
fake.gap_every=0
fake.timeout_every=0
fake.jitter_ns=0
