[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shakepie-terminal"
version = "1.0.0"
description = "Terminal console for the ShakePie recorder: offload data, manage days, change settings over SSH"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "paramiko>=3.4",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-paramiko>=3.4",
]

[project.urls]
Repository = "https://github.com/QuakePie/ShakePi"
Issues = "https://github.com/QuakePie/ShakePi/issues"

[project.scripts]
shakepie-terminal = "shakepie_terminal.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shakepie_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shakepie_terminal"]

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true
